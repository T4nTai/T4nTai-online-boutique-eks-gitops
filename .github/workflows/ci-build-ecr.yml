name: CI - Build, Scan & Push to Amazon ECR

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/ci-build-ecr.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Chọn service muốn build (all = toàn bộ 11 microservices)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice

permissions:
  id-token: write   # Bắt buộc để GitHub cấp JWT token cho AWS IAM OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: online-boutique

jobs:
  # Job 1: Phát hiện chính xác các microservice có code thay đổi để tránh rebuild thừa
  detect-changes:
    name: Detect changed microservices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_changes: ${{ steps.build-matrix.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect modified service directories
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            adservice:
              - 'src/adservice/**'
            cartservice:
              - 'src/cartservice/**'
            checkoutservice:
              - 'src/checkoutservice/**'
            currencyservice:
              - 'src/currencyservice/**'
            emailservice:
              - 'src/emailservice/**'
            frontend:
              - 'src/frontend/**'
            loadgenerator:
              - 'src/loadgenerator/**'
            paymentservice:
              - 'src/paymentservice/**'
            productcatalogservice:
              - 'src/productcatalogservice/**'
            recommendationservice:
              - 'src/recommendationservice/**'
            shippingservice:
              - 'src/shippingservice/**'

      - name: Build dynamic matrix JSON
        id: build-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          CHANGED_JSON: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          ALL_SERVICES='["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_SERVICE" = "all" ]; then
              SELECTED="$ALL_SERVICES"
            else
              SELECTED=$(jq -nc --arg s "$INPUT_SERVICE" '[$s]')
            fi
          else
            SELECTED="$CHANGED_JSON"
          fi

          # Gắn đúng thư mục build context (cartservice nằm ở src/cartservice/src)
          MATRIX=$(echo "$SELECTED" | jq -c '
            map({
              name: .,
              context: (if . == "cartservice" then "src/cartservice/src" else "src/" + . end)
            })
          ')

          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "Selected services ($COUNT): $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  # Job 2: Build song song các service, quét CVE bằng Trivy, và push lên Amazon ECR qua OIDC
  build-scan-push:
    name: Build & Scan (${{ matrix.service.name }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short Git SHA tag
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (load locally for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.PROJECT_NAME }}/${{ matrix.service.name }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Run Trivy vulnerability scanner (DevSecOps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.PROJECT_NAME }}/${{ matrix.service.name }}:${{ steps.meta.outputs.sha_short }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Để exit-code: '0' khi thực hành để xem báo cáo CVE mà không bị chặn build;
          # Trong môi trường production nghiêm ngặt, đổi thành '1' để chặn release khi có lỗ hổng Critical.
          exit-code: "0"

      # Chỉ xác thực AWS và push lên ECR khi push vào main hoặc chạy thủ công (không push trên Pull Request)
      - name: Configure AWS credentials via OIDC (no static keys)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to Amazon ECR
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_LOCAL: ${{ env.PROJECT_NAME }}/${{ matrix.service.name }}:${{ steps.meta.outputs.sha_short }}
          IMAGE_SHA: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service.name }}:${{ steps.meta.outputs.sha_short }}
          IMAGE_LATEST: ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/${{ matrix.service.name }}:latest
        run: |
          docker tag "$IMAGE_LOCAL" "$IMAGE_SHA"
          docker tag "$IMAGE_LOCAL" "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "Pushed $IMAGE_SHA"
